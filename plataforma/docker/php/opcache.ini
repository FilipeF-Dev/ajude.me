; Ajuste de desenvolvimento. Em produção, use validate_timestamps=0 e limpe
; o cache no deploy.
opcache.enable=1
opcache.enable_cli=1
opcache.memory_consumption=256
opcache.interned_strings_buffer=16
opcache.max_accelerated_files=20000

; Recarrega ao salvar, mas confere no máximo uma vez a cada 2s por arquivo.
opcache.validate_timestamps=1
opcache.revalidate_freq=2

; O `realpath` é o que mais dói num bind mount: cada `require` resolve o
; caminho inteiro. Um cache grande e longo evita repetir isso.
realpath_cache_size=8M
realpath_cache_ttl=600
