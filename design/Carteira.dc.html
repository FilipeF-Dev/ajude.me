<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin: 0; }
    a { color: #2E6B4F; } a:hover { color: #24543E; }
  </style>
</helmet>
<div style="width: 375px; height: 812px; background: #FAF7F2; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif; color: #1F1C19; display: flex; flex-direction: column; overflow: hidden; position: relative;">

  <div style="padding: 56px 20px 16px; display: flex; flex-direction: column; gap: 6px;">
    <div style="font-size: 27px; font-weight: 700; letter-spacing: -0.02em;">Carteira</div>
    <div style="font-size: 14px; color: #857A6E; line-height: 1.45;">Cada ticket é o direito de receber um favor.</div>
  </div>

  <div style="display: flex; gap: 8px; padding: 0 20px 16px; overflow: hidden;">
    <div style="background: {{accent}}; color: #FFFFFF; border-radius: 999px; padding: 9px 15px; font-size: 14px; font-weight: 600; white-space: nowrap;">Disponíveis · 4</div>
    <div style="background: #FFFFFF; border: 1px solid #EDE6DC; color: #5E5449; border-radius: 999px; padding: 9px 15px; font-size: 14px; font-weight: 500; white-space: nowrap;">Em negociação · 1</div>
    <div style="background: #FFFFFF; border: 1px solid #EDE6DC; color: #5E5449; border-radius: 999px; padding: 9px 15px; font-size: 14px; font-weight: 500; white-space: nowrap;">Reservados</div>
  </div>

  <div style="flex-grow: 1; overflow: hidden; padding: 0 20px; display: flex; flex-direction: column; gap: 13px;">

    <sc-for list="{{tickets}}" as="t" hint-placeholder-count="3">
      <div style="position: relative; background: #FFFFFF; border: 1px solid #EDE6DC; border-radius: 18px; box-shadow: 0 1px 2px rgba(31, 28, 25, 0.04); display: flex;">
        <div style="width: 5px; border-radius: 18px 0 0 18px; background: {{accent}}; flex-shrink: 0;"></div>
        <div style="flex-grow: 1; min-width: 0;">
          <div style="padding: 15px 16px 14px; display: flex; flex-direction: column; gap: 11px;">
            <div style="display: flex; flex-direction: column; gap: 4px;">
              <div style="font-size: 16px; font-weight: 600; line-height: 1.3; letter-spacing: -0.01em;">{{t.titulo}}</div>
              <div style="font-size: 14px; color: #857A6E;">Ajudante: {{t.pessoa}}</div>
            </div>
            <div style="display: flex; align-items: center; gap: 7px; background: #F5F1EA; border-radius: 999px; padding: 7px 12px; align-self: flex-start;">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#6B6055" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg>
              <span style="font-size: 13px; font-weight: 600; color: #3A342E;">{{t.tempo}}</span>
              <span style="font-size: 13px; color: #C6BCB0;">·</span>
              <span style="font-size: 13px; font-weight: 600; color: {{accent}};">{{t.nivel}}</span>
            </div>
          </div>
          <div style="position: relative; border-top: 1px dashed #E3DACE;">
            <div style="position: absolute; left: -13px; top: -8px; width: 16px; height: 16px; border-radius: 999px; background: #FAF7F2; border: 1px solid #EDE6DC;"></div>
            <div style="position: absolute; right: -9px; top: -8px; width: 16px; height: 16px; border-radius: 999px; background: #FAF7F2; border: 1px solid #EDE6DC;"></div>
          </div>
          <div style="padding: 12px 16px 13px; display: flex; align-items: center; justify-content: space-between; gap: 12px;">
            <span style="font-size: 13px; color: #857A6E;">Vale até {{t.validade}}</span>
            <span style="font-size: 12px; font-weight: 600; color: #9A9086; letter-spacing: 0.04em;">{{t.codigo}}</span>
          </div>
        </div>
      </div>
    </sc-for>

  </div>

  <div style="padding: 14px 16px 22px;">
    <div style="background: #FFFFFF; border: 1px solid #EDE6DC; border-radius: 22px; box-shadow: 0 3px 14px rgba(31, 28, 25, 0.07); height: 68px; display: flex; align-items: center; justify-content: space-between; padding: 0 6px;">

      <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; gap: 4px;">
        <svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="#9A9086" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10.5 12 4l8 6.5V19a1 1 0 0 1-1 1h-4v-6H9v6H5a1 1 0 0 1-1-1Z"></path></svg>
        <span style="font-size: 11px; font-weight: 500; color: #9A9086;">Início</span>
      </div>

      <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; gap: 4px;">
        <svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="{{accent}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8a2 2 0 0 1 2-2h13a1 1 0 0 1 1 1v2"></path><path d="M3 8v9a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-6a1 1 0 0 0-1-1H5a2 2 0 0 1-2-2Z"></path></svg>
        <span style="font-size: 11px; font-weight: 600; color: {{accent}};">Carteira</span>
      </div>

      <div style="flex-grow: 1; display: flex; align-items: center; justify-content: center;">
        <div style="width: 56px; height: 56px; border-radius: 999px; background: {{accent}}; display: flex; align-items: center; justify-content: center; margin-top: -22px; box-shadow: 0 4px 12px rgba(31, 28, 25, 0.18); border: 4px solid #FAF7F2;">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>
        </div>
      </div>

      <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; gap: 4px;">
        <svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="#9A9086" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 15a2 2 0 0 1-2 2H8l-4 4V6a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2Z"></path></svg>
        <span style="font-size: 11px; font-weight: 500; color: #9A9086;">Conversas</span>
      </div>

      <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; gap: 4px;">
        <svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="#9A9086" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"></circle><path d="M5 20c0-3.3 3.1-5.5 7-5.5s7 2.2 7 5.5"></path></svg>
        <span style="font-size: 11px; font-weight: 500; color: #9A9086;">Perfil</span>
      </div>

    </div>
  </div>

</div>
</x-dc>
<script data-dc-script data-props='{"accent":{"editor":"color","default":"#2E6B4F","options":["#2E6B4F","#B0563A","#6E6136"],"section":"Tema"}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      accent: this.props.accent ?? '#2E6B4F',
      tickets: [
        { titulo: 'Conserto de bicicleta', pessoa: 'Josenildo Braga', tempo: '≈ 1h30', nivel: 'Avançado', validade: '20/03/2027', codigo: 'TK-4429' },
        { titulo: 'Bolo caseiro por encomenda', pessoa: 'Sueli Andrade', tempo: '≈ 2h', nivel: 'Intermediário', validade: '05/01/2027', codigo: 'TK-3187' },
        { titulo: 'Instalação de computador', pessoa: 'Edilson Prado', tempo: '≈ 30min', nivel: 'Especialista', validade: '14/12/2026', codigo: 'TK-2904' }
      ]
    };
  }
}
</script>
</body>
</html>
