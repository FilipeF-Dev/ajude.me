<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin: 0; }
    a { color: #2E6B4F; } a:hover { color: #24543E; }
  </style>
</helmet>
<div style="width: 375px; height: 812px; background: #FAF7F2; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif; color: #1F1C19; display: flex; flex-direction: column; overflow: hidden; position: relative;">

  <div style="padding: 52px 20px 0; display: flex; align-items: center; gap: 14px;">
    <div style="width: 42px; height: 42px; border-radius: 999px; background: #FFFFFF; border: 1px solid #EDE6DC; display: flex; align-items: center; justify-content: center;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#3A342E" stroke-width="2.2" stroke-linecap="round"><path d="M6 6 18 18M18 6 6 18"></path></svg>
    </div>
    <span style="font-size: 15px; font-weight: 600; color: #857A6E;">Oferecer ajuda</span>
  </div>

  <div style="padding: 18px 20px 24px; display: flex; gap: 6px;">
    <div style="flex-grow: 1; height: 4px; border-radius: 999px; background: {{accent}};"></div>
    <div style="flex-grow: 1; height: 4px; border-radius: 999px; background: #E6DDD1;"></div>
    <div style="flex-grow: 1; height: 4px; border-radius: 999px; background: #E6DDD1;"></div>
    <div style="flex-grow: 1; height: 4px; border-radius: 999px; background: #E6DDD1;"></div>
  </div>

  <div style="flex-grow: 1; overflow: hidden; padding: 0 20px; display: flex; flex-direction: column; gap: 22px;">

    <div style="display: flex; flex-direction: column; gap: 9px;">
      <div style="font-size: 25px; font-weight: 700; line-height: 1.22; letter-spacing: -0.02em;">O que você sabe fazer?</div>
      <div style="font-size: 15px; line-height: 1.55; color: #6B6055; text-wrap: pretty;">Não precisa ser profissão. Pode ser algo que você faz bem no dia a dia e que ajudaria alguém.</div>
    </div>

    <div style="display: flex; align-items: center; gap: 11px; background: #FFFFFF; border: 1px solid #EDE6DC; border-radius: 16px; padding: 0 15px; height: 54px; box-shadow: 0 1px 2px rgba(31, 28, 25, 0.04);">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="{{accent}}" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
      <span style="font-size: 15px; color: #9A9086;">Ex.: consertar bicicleta, cortar cabelo</span>
    </div>

    <div style="display: flex; flex-direction: column; gap: 11px;">
      <div style="font-size: 15px; font-weight: 600; color: #5E5449;">Suas habilidades</div>

      <div style="background: #FFFFFF; border: 1.5px solid {{accent}}; border-radius: 18px; padding: 15px 16px; display: flex; align-items: center; gap: 13px;">
        <div style="width: 22px; height: 22px; border-radius: 999px; background: {{accent}}; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="m5 13 4 4 10-10"></path></svg>
        </div>
        <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 3px; min-width: 0;">
          <div style="font-size: 16px; font-weight: 600;">Currículo e carreira</div>
          <div style="font-size: 13px; font-weight: 600; color: {{accent}};">Avançado</div>
        </div>
      </div>

      <div style="background: #FFFFFF; border: 1px solid #EDE6DC; border-radius: 18px; padding: 15px 16px; display: flex; align-items: center; gap: 13px;">
        <div style="width: 22px; height: 22px; border-radius: 999px; border: 1.5px solid #DCD1C2; flex-shrink: 0;"></div>
        <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 3px; min-width: 0;">
          <div style="font-size: 16px; font-weight: 600;">Aulas de português</div>
          <div style="font-size: 13px; font-weight: 600; color: #857A6E;">Intermediário</div>
        </div>
      </div>

      <div style="border: 1.5px dashed #DCD1C2; border-radius: 18px; height: 56px; display: flex; align-items: center; justify-content: center; gap: 9px;">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="{{accent}}" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>
        <span style="font-size: 15px; font-weight: 600; color: {{accent}};">Tenho outra habilidade</span>
      </div>
    </div>

  </div>

  <div style="padding: 14px 20px 26px;">
    <div style="height: 56px; border-radius: 17px; background: {{accent}}; display: flex; align-items: center; justify-content: center; box-shadow: 0 3px 12px rgba(31, 28, 25, 0.14);">
      <span style="font-size: 17px; font-weight: 600; color: #FFFFFF;">Continuar</span>
    </div>
  </div>

</div>
</x-dc>
<script data-dc-script data-props='{"accent":{"editor":"color","default":"#2E6B4F","options":["#2E6B4F","#B0563A","#6E6136"],"section":"Tema"}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#2E6B4F' };
  }
}
</script>
</body>
</html>
