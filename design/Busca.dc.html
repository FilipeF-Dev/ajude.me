<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin: 0; }
    a { color: #2E6B4F; } a:hover { color: #24543E; }
  </style>
</helmet>
<div style="width: 375px; height: 812px; background: #FAF7F2; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif; color: #1F1C19; display: flex; flex-direction: column; overflow: hidden; position: relative;">

  <div style="padding: 56px 20px 16px;">
    <div style="display: flex; align-items: center; gap: 11px; background: #FFFFFF; border: 1.5px solid {{accent}}; border-radius: 16px; padding: 0 15px; height: 54px; box-shadow: 0 1px 2px rgba(31, 28, 25, 0.04);">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="{{accent}}" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
      <span style="flex-grow: 1; font-size: 15px; font-weight: 500; color: #1F1C19;">trocar a resistência do chuveiro</span>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#B5AA9D" stroke-width="2.2" stroke-linecap="round"><path d="M6 6 18 18M18 6 6 18"></path></svg>
    </div>
  </div>

  <div style="padding: 0 20px 18px; display: flex; flex-direction: column; gap: 10px;">
    <div style="font-size: 14px; color: #857A6E;">Isso costuma ser com quem entende de</div>
    <div style="display: flex; gap: 8px; flex-wrap: wrap;">
      <div style="display: flex; align-items: center; gap: 7px; background: #FFFFFF; border: 1.5px solid {{accent}}; border-radius: 999px; padding: 8px 14px;">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="{{accent}}" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m13 3-8 10h6l-2 8 8-10h-6Z"></path></svg>
        <span style="font-size: 14px; font-weight: 600; color: {{accent}};">Elétrica residencial</span>
      </div>
      <div style="display: flex; align-items: center; gap: 7px; background: #FFFFFF; border: 1px solid #EDE6DC; border-radius: 999px; padding: 8px 14px;">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#857A6E" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m14 6 4 4-8 8-4 1 1-4Z"></path><path d="m17 3 4 4"></path></svg>
        <span style="font-size: 14px; font-weight: 500; color: #5E5449;">Reparos domésticos</span>
      </div>
    </div>
  </div>

  <div style="flex-grow: 1; overflow: hidden; padding: 0 20px; display: flex; flex-direction: column; gap: 12px;">
    <div style="font-size: 15px; font-weight: 600; color: #5E5449;">3 pessoas perto de você podem ajudar</div>

    <sc-for list="{{favores}}" as="f" hint-placeholder-count="3">
      <div style="background: #FFFFFF; border: 1px solid #EDE6DC; border-radius: 18px; padding: 16px; box-shadow: 0 1px 2px rgba(31, 28, 25, 0.04); display: flex; flex-direction: column; gap: 13px;">
        <div style="display: flex; gap: 13px; align-items: flex-start;">
          <div style="width: 46px; height: 46px; border-radius: 999px; background: #F2EEE7; display: flex; align-items: center; justify-content: center; font-size: 17px; font-weight: 600; color: #6B6055; flex-shrink: 0;">{{f.inicial}}</div>
          <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 4px; min-width: 0;">
            <div style="font-size: 16px; font-weight: 600; line-height: 1.3; letter-spacing: -0.01em;">{{f.titulo}}</div>
            <div style="font-size: 14px; color: #857A6E;">{{f.pessoa}} · {{f.distancia}}</div>
          </div>
        </div>
        <div style="display: flex; align-items: center; gap: 8px;">
          <div style="display: flex; align-items: center; gap: 7px; background: #F5F1EA; border-radius: 999px; padding: 8px 13px;">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#6B6055" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg>
            <span style="font-size: 13px; font-weight: 600; color: #3A342E;">{{f.tempo}}</span>
            <span style="font-size: 13px; color: #C6BCB0;">·</span>
            <span style="font-size: 13px; font-weight: 600; color: {{accent}};">{{f.nivel}}</span>
          </div>
          <div style="font-size: 13px; color: #857A6E; font-weight: 500;">{{f.modalidade}}</div>
        </div>
      </div>
    </sc-for>
  </div>

  <div style="padding: 14px 16px 22px;">
    <div style="background: #FFFFFF; border: 1px solid #EDE6DC; border-radius: 22px; box-shadow: 0 3px 14px rgba(31, 28, 25, 0.07); height: 68px; display: flex; align-items: center; justify-content: space-between; padding: 0 6px;">

      <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; gap: 4px;">
        <svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="{{accent}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10.5 12 4l8 6.5V19a1 1 0 0 1-1 1h-4v-6H9v6H5a1 1 0 0 1-1-1Z"></path></svg>
        <span style="font-size: 11px; font-weight: 600; color: {{accent}};">Início</span>
      </div>

      <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; gap: 4px;">
        <svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="#9A9086" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8a2 2 0 0 1 2-2h13a1 1 0 0 1 1 1v2"></path><path d="M3 8v9a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-6a1 1 0 0 0-1-1H5a2 2 0 0 1-2-2Z"></path></svg>
        <span style="font-size: 11px; font-weight: 500; color: #9A9086;">Carteira</span>
      </div>

      <div style="flex-grow: 1; display: flex; align-items: center; justify-content: center;">
        <div style="width: 56px; height: 56px; border-radius: 999px; background: {{accent}}; display: flex; align-items: center; justify-content: center; margin-top: -22px; box-shadow: 0 4px 12px rgba(31, 28, 25, 0.18); border: 4px solid #FAF7F2;">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>
        </div>
      </div>

      <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; gap: 4px;">
        <svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="#9A9086" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 15a2 2 0 0 1-2 2H8l-4 4V6a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2Z"></path></svg>
        <span style="font-size: 11px; font-weight: 500; color: #9A9086;">Conversas</span>
      </div>

      <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; gap: 4px;">
        <svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="#9A9086" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"></circle><path d="M5 20c0-3.3 3.1-5.5 7-5.5s7 2.2 7 5.5"></path></svg>
        <span style="font-size: 11px; font-weight: 500; color: #9A9086;">Perfil</span>
      </div>

    </div>
  </div>

</div>
</x-dc>
<script data-dc-script data-props='{"accent":{"editor":"color","default":"#2E6B4F","options":["#2E6B4F","#B0563A","#6E6136"],"section":"Tema"}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      accent: this.props.accent ?? '#2E6B4F',
      favores: [
        { inicial: 'E', titulo: 'Instalações e reparos elétricos', pessoa: 'Edilson Prado', distancia: '800 m', tempo: '≈ 40min', nivel: 'Especialista', modalidade: 'Presencial' },
        { inicial: 'A', titulo: 'Pequenos reparos em casa', pessoa: 'Antônio Ferraz', distancia: '1,5 km', tempo: '≈ 1h', nivel: 'Avançado', modalidade: 'Presencial' },
        { inicial: 'V', titulo: 'Troca de peças e manutenção geral', pessoa: 'Vanderlei Souza', distancia: '400 m', tempo: '≈ 1h30', nivel: 'Intermediário', modalidade: 'Presencial' }
      ]
    };
  }
}
</script>
</body>
</html>
