      <div style="display: flex; align-items: center; gap: 12px;">

      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 11px;">
      <div style="font-size: 14px; font-weight: 600; color: #5E5449;">Preciso ser avisado com</div>
      <div style="display: flex; gap: 8px;">
        <div style="background: #FFFFFF; border: 1px solid #EDE6DC; color: #5E5449; border-radius: 999px; padding: 11px 18px; font-size: 15px; font-weight: 500;">1 dia</div>
        <div style="background: {{accent}}; color: #FFFFFF; border-radius: 999px; padding: 11px 18px; font-size: 15px; font-weight: 600;">2 dias</div>

    </div>
  </div>

</div>
</x-dc>
