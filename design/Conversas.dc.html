<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin: 0; }
    a { color: #2E6B4F; } a:hover { color: #24543E; }
  </style>
</helmet>
<div style="width: 375px; height: 812px; background: #FAF7F2; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif; color: #1F1C19; display: flex; flex-direction: column; overflow: hidden; position: relative;">

  <div style="padding: 56px 20px 18px;">
    <div style="font-size: 27px; font-weight: 700; letter-spacing: -0.02em;">Conversas</div>
  </div>

  <div style="flex-grow: 1; overflow: hidden; padding: 0 20px; display: flex; flex-direction: column; gap: 20px;">

    <div style="display: flex; flex-direction: column; gap: 11px;">
      <div style="display: flex; align-items: center; gap: 8px;">
        <div style="width: 7px; height: 7px; border-radius: 999px; background: {{accent}};"></div>
        <span style="font-size: 15px; font-weight: 600; color: {{accent}};">Esperando você</span>
      </div>

      <sc-for list="{{esperando}}" as="c" hint-placeholder-count="2">
        <div style="background: #FFFFFF; border: 1.5px solid {{accent}}; border-radius: 18px; padding: 15px 16px; display: flex; gap: 13px; align-items: flex-start; box-shadow: 0 1px 2px rgba(31, 28, 25, 0.04);">
          <div style="width: 46px; height: 46px; border-radius: 999px; background: #F2EEE7; display: flex; align-items: center; justify-content: center; font-size: 17px; font-weight: 600; color: #6B6055; flex-shrink: 0;">{{c.inicial}}</div>
          <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 5px; min-width: 0;">
            <div style="display: flex; align-items: baseline; justify-content: space-between; gap: 10px;">
              <span style="font-size: 16px; font-weight: 600;">{{c.nome}}</span>
              <span style="font-size: 12px; color: #9A9086; flex-shrink: 0;">{{c.quando}}</span>
            </div>
            <div style="font-size: 14px; line-height: 1.4; color: #6B6055;">{{c.previa}}</div>
            <div style="background: #F0F5F1; border-radius: 999px; padding: 5px 11px; align-self: flex-start; margin-top: 2px;">
              <span style="font-size: 12px; font-weight: 600; color: {{accent}};">{{c.marca}}</span>
            </div>
          </div>
        </div>
      </sc-for>
    </div>

    <div style="display: flex; flex-direction: column; gap: 11px;">
      <span style="font-size: 15px; font-weight: 600; color: #857A6E;">Em andamento</span>

      <sc-for list="{{andamento}}" as="c" hint-placeholder-count="2">
        <div style="background: #FFFFFF; border: 1px solid #EDE6DC; border-radius: 18px; padding: 15px 16px; display: flex; gap: 13px; align-items: flex-start;">
          <div style="width: 46px; height: 46px; border-radius: 999px; background: #F2EEE7; display: flex; align-items: center; justify-content: center; font-size: 17px; font-weight: 600; color: #6B6055; flex-shrink: 0;">{{c.inicial}}</div>
          <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 5px; min-width: 0;">
            <div style="display: flex; align-items: baseline; justify-content: space-between; gap: 10px;">
              <span style="font-size: 16px; font-weight: 600;">{{c.nome}}</span>
              <span style="font-size: 12px; color: #9A9086; flex-shrink: 0;">{{c.quando}}</span>
            </div>
            <div style="font-size: 14px; line-height: 1.4; color: #857A6E;">{{c.previa}}</div>
            <div style="background: #F5F1EA; border-radius: 999px; padding: 5px 11px; align-self: flex-start; margin-top: 2px;">
              <span style="font-size: 12px; font-weight: 600; color: #6B6055;">{{c.marca}}</span>
            </div>
          </div>
        </div>
      </sc-for>
    </div>

    <div style="display: flex; gap: 11px; background: #F5F1EA; border-radius: 16px; padding: 14px 15px;">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#857A6E" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0; margin-top: 1px;"><path d="M3 8a2 2 0 0 1 2-2h13a1 1 0 0 1 1 1v2"></path><path d="M3 8v9a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-6a1 1 0 0 0-1-1H5a2 2 0 0 1-2-2Z"></path></svg>
      <div style="font-size: 14px; line-height: 1.5; color: #5E5449; text-wrap: pretty;">Favores já combinados ficam na Carteira, em <strong style="font-weight: 600;">Reservados</strong>.</div>
    </div>

  </div>

  <div style="padding: 14px 16px 22px;">
    <div style="background: #FFFFFF; border: 1px solid #EDE6DC; border-radius: 22px; box-shadow: 0 3px 14px rgba(31, 28, 25, 0.07); height: 68px; display: flex; align-items: center; justify-content: space-between; padding: 0 6px;">

      <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; gap: 4px;">
        <svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="#9A9086" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10.5 12 4l8 6.5V19a1 1 0 0 1-1 1h-4v-6H9v6H5a1 1 0 0 1-1-1Z"></path></svg>
        <span style="font-size: 11px; font-weight: 500; color: #9A9086;">Início</span>
      </div>

      <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; gap: 4px;">
        <svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="#9A9086" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8a2 2 0 0 1 2-2h13a1 1 0 0 1 1 1v2"></path><path d="M3 8v9a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-6a1 1 0 0 0-1-1H5a2 2 0 0 1-2-2Z"></path></svg>
        <span style="font-size: 11px; font-weight: 500; color: #9A9086;">Carteira</span>
      </div>

      <div style="flex-grow: 1; display: flex; align-items: center; justify-content: center;">
        <div style="width: 56px; height: 56px; border-radius: 999px; background: {{accent}}; display: flex; align-items: center; justify-content: center; margin-top: -22px; box-shadow: 0 4px 12px rgba(31, 28, 25, 0.18); border: 4px solid #FAF7F2;">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>
        </div>
      </div>

      <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; position: relative;">
        <svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="{{accent}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 15a2 2 0 0 1-2 2H8l-4 4V6a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2Z"></path></svg>
        <span style="font-size: 11px; font-weight: 600; color: {{accent}};">Conversas</span>
        <div style="position: absolute; top: -2px; right: 22px; width: 9px; height: 9px; border-radius: 999px; background: {{accent}}; border: 2px solid #FFFFFF;"></div>
      </div>

      <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; gap: 4px;">
        <svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="#9A9086" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"></circle><path d="M5 20c0-3.3 3.1-5.5 7-5.5s7 2.2 7 5.5"></path></svg>
        <span style="font-size: 11px; font-weight: 500; color: #9A9086;">Perfil</span>
      </div>

    </div>
  </div>

</div>
</x-dc>
<script data-dc-script data-props='{"accent":{"editor":"color","default":"#2E6B4F","options":["#2E6B4F","#B0563A","#6E6136"],"section":"Tema"}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      accent: this.props.accent ?? '#2E6B4F',
      esperando: [
        { inicial: 'C', nome: 'Cleide Ramos', quando: '2 h', previa: 'Dá para ser num sábado?', marca: 'Responder' },
        { inicial: 'M', nome: 'Marlene Bispo', quando: 'ontem', previa: 'Ofereceu 1 ticket pela sua aula de português.', marca: 'Proposta recebida' }
      ],
      andamento: [
        { inicial: 'E', nome: 'Edilson Prado', quando: 'seg', previa: 'Combinado, quinta às 16h.', marca: 'Favor combinado' },
        { inicial: 'S', nome: 'Sueli Andrade', quando: '12 mar', previa: 'Obrigada, ficou ótimo!', marca: 'Encerrada' }
      ]
    };
  }
}
</script>
</body>
</html>
