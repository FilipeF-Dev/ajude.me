<!doctype html>
<html>
<head>

  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin: 0; }
    a { color: #2E6B4F; } a:hover { color: #24543E; }
  </style>
</helmet>
<div style="width: 375px; height: 812px; background: #FAF7F2; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif; color: #1F1C19; display: flex; flex-direction: column; overflow: hidden; position: relative;">

  <div style="padding: 56px 20px 14px; display: flex; align-items: center; gap: 14px;">
    <div style="width: 42px; height: 42px; border-radius: 999px; background: #FFFFFF; border: 1px solid #EDE6DC; display: flex; align-items: center; justify-content: center;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#3A342E" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 5-7 7 7 7"></path></svg>
    </div>
    <span style="font-size: 19px; font-weight: 700; letter-spacing: -0.01em;">Nova proposta</span>
  </div>

  <div style="flex-grow: 1; overflow: hidden; padding: 6px 20px 0; display: flex; flex-direction: column; gap: 6px;">

    <div style="font-size: 14px; font-weight: 600; color: #857A6E; letter-spacing: 0.01em; padding-bottom: 8px;">VOCÊ RECEBE</div>

    <div style="background: #FFFFFF; border: 1.5px solid {{accent}}; border-radius: 18px; padding: 15px 16px; display: flex; gap: 13px; align-items: center;">
      <div style="width: 44px; height: 44px; border-radius: 999px; background: #F2EEE7; display: flex; align-items: center; justify-content: center; font-size: 17px; font-weight: 600; color: #6B6055; flex-shrink: 0;">C</div>
      <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 5px; min-width: 0;">
        <div style="font-size: 16px; font-weight: 600; line-height: 1.3;">Costura e ajuste de roupas</div>
        <div style="display: flex; align-items: center; gap: 6px;">
          <span style="font-size: 13px; font-weight: 600; color: #3A342E;">≈ 1h</span>
          <span style="font-size: 13px; color: #C6BCB0;">·</span>
          <span style="font-size: 13px; font-weight: 600; color: {{accent}};">Especialista</span>
          <span style="font-size: 13px; color: #C6BCB0;">·</span>
          <span style="font-size: 13px; color: #857A6E;">Cleide</span>
        </div>
      </div>
    </div>

    <div style="display: flex; align-items: center; gap: 12px; padding: 14px 0 12px;">
      <div style="flex-grow: 1; height: 1px; background: #E6DDD1;"></div>
      <div style="width: 40px; height: 40px; border-radius: 999px; background: #FFFFFF; border: 1px solid #EDE6DC; display: flex; align-items: center; justify-content: center;">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#6B6055" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M17 4v13"></path><path d="m13 8 4-4 4 4"></path><path d="M7 20V7"></path><path d="m3 16 4 4 4-4"></path></svg>
      </div>
      <div style="flex-grow: 1; height: 1px; background: #E6DDD1;"></div>
    </div>

    <div style="font-size: 14px; font-weight: 600; color: #857A6E; letter-spacing: 0.01em; padding-bottom: 8px;">VOCÊ OFERECE</div>

    <div style="display: flex; flex-direction: column; gap: 10px;">
      <div style="background: #FFFFFF; border: 1px solid #EDE6DC; border-radius: 18px; padding: 15px 16px; display: flex; gap: 13px; align-items: center;">
        <div style="width: 44px; height: 44px; border-radius: 999px; background: #F2EEE7; display: flex; align-items: center; justify-content: center; font-size: 17px; font-weight: 600; color: #6B6055; flex-shrink: 0;">P</div>
        <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 5px; min-width: 0;">
          <div style="font-size: 16px; font-weight: 600; line-height: 1.3;">Currículo e preparo para entrevista</div>
          <div style="display: flex; align-items: center; gap: 6px;">
            <span style="font-size: 13px; font-weight: 600; color: #3A342E;">≈ 1h</span>
            <span style="font-size: 13px; color: #C6BCB0;">·</span>
            <span style="font-size: 13px; font-weight: 600; color: {{accent}};">Avançado</span>
          </div>
        </div>
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#B5AA9D" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6 18 18M18 6 6 18"></path></svg>
      </div>

      <div style="border: 1.5px dashed #DCD1C2; border-radius: 18px; height: 60px; display: flex; align-items: center; justify-content: center; gap: 9px;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="{{accent}}" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>
        <span style="font-size: 15px; font-weight: 600; color: {{accent}};">Escolher da carteira</span>
      </div>
    </div>

    <div style="display: flex; gap: 11px; background: #F5F1EA; border-radius: 16px; padding: 14px 15px; margin-top: 16px;">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#857A6E" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0; margin-top: 1px;"><circle cx="12" cy="12" r="9"></circle><path d="M12 16v-4"></path><path d="M12 8.5v.01"></path></svg>
      <div style="font-size: 14px; line-height: 1.5; color: #5E5449; text-wrap: pretty;">Não existe preço aqui. Vocês dois decidem se a troca é justa — e podem conversar antes de fechar.</div>
    </div>

  </div>

  <div style="padding: 14px 20px 26px;">
    <div style="height: 56px; border-radius: 17px; background: {{accent}}; display: flex; align-items: center; justify-content: center; box-shadow: 0 3px 12px rgba(31, 28, 25, 0.14);">
      <span style="font-size: 17px; font-weight: 600; color: #FFFFFF;">Enviar proposta</span>
    </div>
  </div>

</div>
</x-dc>
<script data-dc-script data-props='{"accent":{"editor":"color","default":"#2E6B4F","options":["#2E6B4F","#B0563A","#6E6136"],"section":"Tema"}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#2E6B4F' };
  }
}
</script>
</body>
</html>
